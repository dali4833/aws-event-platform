apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rework-gateway-route
  namespace: rework
spec:
  parentRefs:
    - name: waypoint
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway
          port: 8084
