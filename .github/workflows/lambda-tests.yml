name: Lambda Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'lambda/**'
      - '.github/workflows/lambda-tests.yml'

jobs:
  test:
    name: Run Lambda Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lambda/producer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Python syntax check
        run: python -m py_compile handler.py

      - name: Import handler
        run: |
          python -c "import handler; print('handler imported OK')"
